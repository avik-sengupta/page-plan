<!DOCTYPE html>
<html>
<head>
    <title>Sandboxed Iframe Example</title>
    
</head>
<body>
    <h1>Main Page</h1>

    <button id='clone'>Create IFrame</button>

    <script>
		const btn = document.getElementById('clone');

		btn.addEventListener('click', () => {

		  // Create iframe
		  const iframe = document.createElement('iframe');

		  // Add sandbox attributes
		  iframe.setAttribute('src', 'clone-plan.html');
		  iframe.setAttribute('sandbox', 'allow-scripts allow-same-origin allow-forms');
		  iframe.setAttribute('width', '100%');
		  iframe.setAttribute('height', '500');

		  // // Set iframe src
		  // iframe.srcdoc = `
		  //   <h1>Iframe Contents</h1>
		  //   <p>This content is sandboxed.</p>  
		  // `;

		  // Append iframe to body
		  document.body.appendChild(iframe);

		});

		const dbName1 = 'browserfs';
		indexedDB.deleteDatabase(dbName1);
	</script>
