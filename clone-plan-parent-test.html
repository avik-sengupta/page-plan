<body>
    <h1>Main Page</h1>

    <button id='clone'>Create IFrame</button>

    <script>
		const btn = document.getElementById('clone');

		btn.addEventListener('click', () => {

		  // Create iframe
		  const iframe = document.createElement('iframe');

		  // Add sandbox attributes
		  iframe.setAttribute('src', 'clone-plan-iframe-test.html');
		  iframe.setAttribute('sandbox', 'allow-scripts allow-same-origin allow-forms');
		  iframe.setAttribute('width', '100%');
		  iframe.setAttribute('height', '500');

		  
		  document.body.appendChild(iframe);

			  window.addEventListener('message', function(event) {
			    try {
			        const jsonData = JSON.parse(event.data);
			        console.log('JSON data received from iframe:', jsonData);
		    	} catch (error) {
		        	console.error('Error parsing JSON:', error);
		   		}
		   		// Send a response back to the iframe
	                const response = {
	                    message: 'Response from parent to iframe'
	                };
	                iframe.contentWindow.postMessage(response, '*');
			});

		});

		// const dbName1 = 'browserfs';
		// indexedDB.deleteDatabase(dbName1);
	</script>
