<!DOCTYPE html>
<html>
<head>
    <title>Page Plan</title>
    <script src="js/browserfs.min.js"></script>
  	<script src="js/index.umd.min.js"></script>
  	<script type="module" src="js/index.js"></script>

  	<script type="module">
  	  
  	</script>
</head>
<body>
    <h1>Main Page</h1>

    <button id='clone'>Create IFrame</button>

    <script type="module">
    	import http from './js/index.js'

		const btn = document.getElementById('clone');

		btn.addEventListener('click', () => {

		  // Create iframe
		  const iframe = document.createElement('iframe');

		  // Add sandbox attributes
		  iframe.setAttribute('src', 'clone-plan-iframe-test.html');
		  iframe.setAttribute('sandbox', 'allow-scripts allow-same-origin allow-forms');
		  iframe.setAttribute('width', '100%');
		  iframe.setAttribute('height', '500');

		  
		  document.body.appendChild(iframe);

			  window.addEventListener('message', function(event) {
			    try {
			        const jsonData = JSON.parse(event.data);
			        console.log('JSON data received from iframe:', jsonData);
			        console.log(jsonData.nestedObject.prop1)
			        console.log(jsonData.nestedObject.prop2)
			        console.log(jsonData.nestedObject.prop3)


			        if (!('indexedDB' in window)) {
							console.log("This browser doesn't support IndexedDB");
							alert("This browser doesn't support IndexedDB")
					}

					// First, we need to initialize BrowserFS.
					BrowserFS.configure({
						fs: "IndexedDB",
						options: {}
					}, function(err) {
					    if (err) {
							// Handle error
							console.log(err);
							return;
						}

						var fs = BrowserFS.BFSRequire('fs');

						console.log(jsonData.nestedObject.prop2)

						const auth = () => ({
							username: jsonData.nestedObject.prop2,
							password: jsonData.nestedObject.prop3
						});

						console.log(auth)

						git.clone({
							fs,
							http,
							dir: '/newpath1',
							//corsProxy: 'https://cors.isomorphic-git.org',
							corsProxy: 'https://www.microcitest.info',
							url: jsonData.nestedObject.prop1,
							singleBranch: false,
							depth: 1,
							onAuth: auth
						}).then(function() {

							console.log('repository clone done')
							console.log(fs)

							// Send a response back to the iframe
			               
	                		//iframe.contentWindow.postMessage({ type: 'BrowserFS', data: fs }, '*');

	                		fs.readdir("/newpath1", function(err, files) {
								if (err) {
									// Handle error
									console.log(err);
									return;
								}
								console.log(files)
								var response = {
			                    	message: files
			                	};
								iframe.contentWindow.postMessage( response, '*');

							});

	                		

						});

					});


		    	} catch (error) {
		        	console.error('Error parsing JSON:', error);
		   		}
		   		
			});

		});

		// const dbName1 = 'browserfs';
		// indexedDB.deleteDatabase(dbName1);
	</script>
  
</body>
</html>
