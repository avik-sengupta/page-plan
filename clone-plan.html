<!DOCTYPE html>
<html>
<head>
  <title>BrowserFS Example</title>
  <script src="js/browserfs.min.js"></script>
  <script src="js/index.umd.min.js"></script>
  <script type="module" src="js/index.js"></script>
  <script type="module">


	  const root = location.pathname.replace(/clone-plan.html$/, '');

		if ('serviceWorker' in navigator) {
         navigator.serviceWorker.register(`sw.js`, { scope: root })
                  .then(function(reg) {
                      reg.addEventListener('updatefound', function() {
                          const installingWorker = reg.installing;
                          console.log('A new service worker is being installed:',
                                      installingWorker);
                      });
                      // registration worked
                      console.log('Registration succeeded. Scope is ' + reg.scope);
                  }).catch(function(error) {
                      // registration failed
                      console.log('Registration failed with ' + error);
                  });
     }


	  import {cloneFunction} from './js/clone.js'

	  //document.querySelector('#clone').addEventListener('click', cloneFunction)
	  const form = document.getElementById('myForm');
  	  form.addEventListener('submit', cloneFunction);
  </script>

  <style>
    .container {
      display: flex;
    }
    
    .box {
      width: 50%;
      border: 1px solid black;
      padding: 10px;
    }
  </style>

</head>
<body>

	<div class="container">
		<div class="box">

			<form id="myForm">
			  <label for="gitUrl">Git URL:</label><br>
			  <input type="text" id="gitUrl"><br>
			  <label for="username">Username:</label><br>
			  <input type="text" id="username"><br>
			  <label for="token">Token:</label><br>
			  <input type="text" id="token"><br>
			  <button type="submit">Submit</button>
			</form>

		</div>

		<div class="box">
		  	<div id="results"></div>
		</div>
</body>
</html>
